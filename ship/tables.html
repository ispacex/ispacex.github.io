// Build TOC
const tocEl = document.getElementById('toc');
tables.forEach(t => {
  const li = document.createElement('li');
  li.innerHTML = `<a href="#table-${t.id}"><span class="tnum">Табл. ${t.id}</span>${t.title}<span class="tch">Глава ${t.chapter}, стр. ${t.page}</span></a>`;
  tocEl.appendChild(li);
});

// Build tables
const container = document.getElementById('tables');
tables.forEach(t => {
  const card = document.createElement('div');
  card.className = 'table-card';
  card.id = 'table-' + t.id;

  const header = document.createElement('div');
  header.className = 'table-header';
  header.innerHTML = `
    <div>
      <span class="table-title"><span class="table-num">Табл. ${t.id}</span>${t.title}</span>
      <div class="table-meta">Глава ${t.chapter}, стр. ${t.page}</div>
    </div>
    <div class="table-actions">
      <button onclick="exportTable('${t.id}')">XLSX</button>
      <a href="viewer.html#page=${t.page}">Открыть в PDF</a>
    </div>`;
  card.appendChild(header);

  const scroll = document.createElement('div');
  scroll.className = 'table-scroll';

  const table = document.createElement('table');
  table.dataset.id = t.id;

  const thead = document.createElement('thead');
  const tr = document.createElement('tr');
  t.headers.forEach(h => {
    const th = document.createElement('th');
    th.textContent = h;
    tr.appendChild(th);
  });
  thead.appendChild(tr);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  t.rows.forEach(row => {
    const tr = document.createElement('tr');
    const cells = row;
    cells.forEach((val, i) => {
      const td = document.createElement('td');
      td.textContent = val;
      if (t.numCols && t.numCols.includes(i)) td.className = 'num';
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  scroll.appendChild(table);
  card.appendChild(scroll);
  container.appendChild(card);
});

function getTableData(id) {
  const t = tables.find(t => t.id === id);
  if (!t) return null;
  const rows = [t.headers];
  t.rows.forEach(row => rows.push(row));
  return { name: 'Табл. ' + t.id, data: rows };
}

function exportTable(id) {
  const td = getTableData(id);
  if (!td) return;
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(td.data);
  XLSX.utils.book_append_sheet(wb, ws, td.name);
  XLSX.writeFile(wb, `markhai_table_${id}.xlsx`);
}

function exportAll() {
  const wb = XLSX.utils.book_new();
  tables.forEach(t => {
    const td = getTableData(t.id);
    if (!td) return;
    const ws = XLSX.utils.aoa_to_sheet(td.data);
    const name = td.name.substring(0, 31);
    XLSX.utils.book_append_sheet(wb, ws, name);
  });
  XLSX.writeFile(wb, 'markhai_tables.xlsx');
}
