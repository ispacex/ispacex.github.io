<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: #0f1115;
  color: #e5e7eb;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 48px 16px;
}
a { color: #60a5fa; text-decoration: none; }
a:hover { text-decoration: underline; }
h2 { font-size: 1.6rem; margin-bottom: 8px; }
h3 { font-size: 1.15rem; margin: 32px 0 16px; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 8px; }
.subtitle { color: #94a3b8; margin-bottom: 24px; font-size: 0.95rem; }
.wrap { width: 100%; max-width: 900px; }
.back { margin-bottom: 24px; }

.filters { margin-bottom: 24px; display: flex; gap: 8px; flex-wrap: wrap; }
.filters button {
  background: #1e293b; color: #e5e7eb; border: 1px solid #334155; border-radius: 6px;
  padding: 6px 14px; font-size: 0.85rem; cursor: pointer; transition: all 0.15s;
}
.filters button:hover { background: #334155; }
.filters button.active { background: #60a5fa; color: #0f1115; border-color: #60a5fa; }

.search-box {
  margin-bottom: 24px;
  width: 100%;
}
.search-box input {
  width: 100%;
  padding: 10px 14px;
  background: #1a1d24;
  border: 1px solid #334155;
  border-radius: 8px;
  color: #e5e7eb;
  font-size: 0.9rem;
  outline: none;
  transition: border-color 0.15s;
}
.search-box input:focus { border-color: #60a5fa; }
.search-box input::placeholder { color: #64748b; }

.formula-card {
  background: #1a1d24;
  border: 1px solid #334155;
  border-radius: 8px;
  margin-bottom: 12px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.formula-card:hover { border-color: #475569; }
.formula-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #15171c;
  border-bottom: 1px solid #262a33;
  flex-wrap: wrap;
  gap: 6px;
}
.formula-desc {
  font-weight: 600;
  font-size: 0.9rem;
  color: #e5e7eb;
}
.formula-meta {
  font-size: 0.78rem;
  color: #64748b;
  display: flex;
  gap: 12px;
  align-items: center;
}
.formula-meta a { font-size: 0.78rem; }
.formula-body {
  padding: 16px;
  min-height: 48px;
  font-size: 1.1rem;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.formula-params {
  padding: 0 16px 12px;
  font-size: 0.8rem;
  color: #94a3b8;
  line-height: 1.6;
  border-top: 1px solid #1e293b;
  padding-top: 10px;
  margin: 0 16px;
}
.formula-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 16px 10px;
  gap: 8px;
}
.latex-code {
  font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
  font-size: 0.75rem;
  color: #64748b;
  background: #12141a;
  border: 1px solid #262a33;
  border-radius: 4px;
  padding: 4px 8px;
  flex: 1;
  overflow-x: auto;
  white-space: nowrap;
  cursor: text;
  user-select: all;
}
.copy-btn {
  background: #1e293b;
  color: #94a3b8;
  border: 1px solid #334155;
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 0.75rem;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.copy-btn:hover { background: #334155; color: #e5e7eb; }
.copy-btn.copied { background: #166534; color: #86efac; border-color: #166534; }

.toc { margin-bottom: 32px; }
.toc ul { list-style: none; padding: 0; }
.toc li { padding: 4px 0; border-bottom: 1px solid #1e293b; }
.toc li a { font-size: 0.85rem; }
.toc .tch { color: #60a5fa; font-weight: 600; margin-right: 6px; }
.toc .tsec { color: #94a3b8; font-size: 0.8rem; }
.count-badge { font-size: 0.75rem; color: #64748b; margin-left: 4px; }
.hidden { display: none; }
</style>
</head>

  { latex: "v_{\\text{макс.}} = 1 \\text{--} 1{,}1 \\sqrt{L_{KLW}}", section: "Использование циклонов", chapter: 5, page: 310, description: "Скорость водоизмещения на курсе фордевинд (средние условия)", params: "При средних условиях ветра и волны на курсе фордевинд" },
  { latex: "v = v_1 \\left(\\frac{z_1}{z}\\right)^\\alpha", section: "Структура ветра", chapter: 5, page: 314, description: "Изменение скорости ветра с высотой", params: "v — скорость на высоте z, v₁ — скорость на высоте z₁ (до 16 м над уровнем моря), α — показатель степени" },
  { latex: "P = m \\cdot \\omega", section: "Взаимодействие яхт", chapter: 5, page: null, description: "Сила, действующая на парус в аэродинамической тени", params: "P — сила, m — масса, ω — угловая скорость" },
  { latex: "W = \\frac{2\\pi r}{T} = \\frac{\\pi \\cdot H}{T}", section: "Волны", chapter: 5, page: 346, description: "Орбитальная скорость частиц воды на волне", params: "W — орбитальная скорость, r — радиус орбиты (= H/2), T — период волны, H — высота волны" },
  { latex: "c = \\frac{L}{T}", section: "Волны", chapter: 5, page: 347, description: "Скорость волны", params: "c — скорость волны, L — длина волны, T — период волны" },
  { latex: "c = 1{,}25\\sqrt{L}", section: "Волны", chapter: 5, page: 347, description: "Скорость волны в зависимости от длины", params: "c — скорость волны (м/сек), L — длина волны (м)" },
  { latex: "R_s = f\\,(G_m \\cdot \\sin \\alpha)", section: "Яхта на волне", chapter: 5, page: 355, description: "Сопротивление склона волны", params: "R_s — сопротивление склона, G_m — вес яхты, α — угол наклона склона волны" },
  { latex: "m \\cdot v = \\frac{G}{g} \\cdot v", section: "Яхта на волне", chapter: 5, page: 356, description: "Количество движения (импульс) яхты", params: "m — масса яхты, v — скорость, G — вес яхты, g — ускорение свободного падения" },
  { latex: "\\frac{G}{g} \\cdot (v - v_1) = \\frac{G}{g} \\cdot \\Delta v = \\Delta R \\cdot t", section: "Яхта на волне", chapter: 5, page: 356, description: "Уравнение импульса — изменение скорости яхты на волне", params: "Δv — изменение скорости, ΔR — добавочное сопротивление, t — время действия" },

  { latex: "t = \\frac{S}{v}", section: "Приливно-отливные течения", chapter: 5, page: 370, description: "Время прохождения дистанции", params: "t — время, S — расстояние, v — скорость" },
  { latex: "v_w = v_j + v_r", section: "Речные течения", chapter: 5, page: 373, description: "Скорость яхты при плавании по течению", params: "v_w — результирующая скорость, v_j — собственная скорость яхты, v_r — скорость течения" },
  { latex: "v_w = v_j - v_r", section: "Речные течения", chapter: 5, page: 373, description: "Скорость яхты при плавании против течения", params: "v_w — результирующая скорость, v_j — собственная скорость яхты, v_r — скорость течения" },
  { latex: "c = \\sqrt{g \\cdot h} = 3{,}13\\sqrt{h}", section: "Мелкая вода", chapter: 5, page: 378, description: "Критическая скорость на мелкой воде", params: "c — критическая скорость (м/сек), g — ускорение свободного падения, h — глубина воды (м)" },
  { latex: "\\frac{v}{\\sqrt{gh}} \\approx 0{,}7", section: "Мелкая вода", chapter: 5, page: 379, description: "Условие максимального сопротивления на мелкой воде", params: "v — скорость яхты, g — ускорение свободного падения, h — глубина воды; при этом отношении сопротивление максимально" },
];

const chapterNames = {
  1: "О силах, движении и яхтах",
  2: "Общие сведения о яхтах",
  3: "Аэродинамика паруса",
  4: "Гидромеханика парусной яхты",
  5: "Ветер и вода"
};

// Filters
const filtersEl = document.getElementById('filters');
let activeChapter = 0;
const allBtn = document.createElement('button');
allBtn.textContent = 'Все';
allBtn.className = 'active';
allBtn.onclick = () => { activeChapter = 0; render(); };
filtersEl.appendChild(allBtn);
for (const ch of [1,2,3,4,5]) {
  const btn = document.createElement('button');
  const count = formulas.filter(f => f.chapter === ch).length;
  btn.textContent = `Гл. ${ch}`;
  btn.dataset.ch = ch;
  btn.onclick = () => { activeChapter = ch; render(); };
  filtersEl.appendChild(btn);
}

// Search
const searchEl = document.getElementById('search');
searchEl.addEventListener('input', () => render());

function render() {
  const query = searchEl.value.toLowerCase().trim();
  const filtered = formulas.filter(f => {
    if (activeChapter && f.chapter !== activeChapter) return false;
    if (query) {
      const haystack = (f.description + ' ' + f.latex + ' ' + f.section).toLowerCase();
      return haystack.includes(query);
    }
    return true;
  });

  // Update filter buttons
  filtersEl.querySelectorAll('button').forEach(btn => {
    btn.classList.remove('active');
    if (activeChapter === 0 && !btn.dataset.ch) btn.classList.add('active');
    if (btn.dataset.ch && parseInt(btn.dataset.ch) === activeChapter) btn.classList.add('active');
  });

  // Build TOC by section
  const tocEl = document.getElementById('toc');
  tocEl.innerHTML = '';
  const sections = [];
  const seen = new Set();
  filtered.forEach(f => {
    const key = f.chapter + ':' + f.section;
    if (!seen.has(key)) {
      seen.add(key);
      sections.push({ chapter: f.chapter, section: f.section, count: filtered.filter(x => x.chapter === f.chapter && x.section === f.section).length });
    }
  });
  sections.forEach(s => {
    const li = document.createElement('li');
    li.innerHTML = `<a href="#sec-${s.chapter}-${s.section.replace(/\s/g,'_')}"><span class="tch">Гл. ${s.chapter}</span>${s.section} <span class="tsec">(${s.count})</span></a>`;
    tocEl.appendChild(li);
  });

  // Build formula cards
  const container = document.getElementById('formulas');
  container.innerHTML = '';
  let currentSection = '';
  filtered.forEach((f, idx) => {
    const secKey = f.chapter + ':' + f.section;
    if (secKey !== currentSection) {
      currentSection = secKey;
      const h = document.createElement('h3');
      h.id = `sec-${f.chapter}-${f.section.replace(/\s/g,'_')}`;
      h.textContent = `Гл. ${f.chapter} — ${f.section}`;
      container.appendChild(h);
    }

    const card = document.createElement('div');
    card.className = 'formula-card';

    const header = document.createElement('div');
    header.className = 'formula-header';
    const pageLink = f.page ? `<a href="djvu-viewer.html?page=${f.page}">стр. ${f.page}</a>` : '';
    header.innerHTML = `<span class="formula-desc">${f.description}</span><span class="formula-meta">${pageLink}</span>`;
    card.appendChild(header);

    const body = document.createElement('div');
    body.className = 'formula-body';
    body.innerHTML = `$$${f.latex}$$`;
    card.appendChild(body);

    if (f.params) {
      const params = document.createElement('div');
      params.className = 'formula-params';
      params.textContent = f.params;
      card.appendChild(params);
    }

    const footer = document.createElement('div');
    footer.className = 'formula-footer';
    const code = document.createElement('code');
    code.className = 'latex-code';
    code.textContent = f.latex;
    footer.appendChild(code);

    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.textContent = 'Копировать';
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(f.latex).then(() => {
        copyBtn.textContent = 'Скопировано!';
        copyBtn.classList.add('copied');
        setTimeout(() => { copyBtn.textContent = 'Копировать'; copyBtn.classList.remove('copied'); }, 1500);
      });
    };
    footer.appendChild(copyBtn);
    card.appendChild(footer);
    container.appendChild(card);
  });

  // Re-typeset MathJax
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise([container]).catch(err => console.log('MathJax error:', err));
  }
}

render();
</script>
