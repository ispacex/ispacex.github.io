<!DOCTYPE html>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: #0f1115;
  color: #e5e7eb;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 48px 16px;
}
a { color: #60a5fa; text-decoration: none; }
a:hover { text-decoration: underline; }
h2 { font-size: 1.6rem; margin-bottom: 8px; }
h3 { font-size: 1.15rem; margin: 32px 0 16px; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 8px; }
.subtitle { color: #94a3b8; margin-bottom: 24px; font-size: 0.95rem; }
.wrap { width: 100%; max-width: 1200px; }
.back { margin-bottom: 24px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
}
.card {
  background: #1a1d24;
  border: 1px solid #334155;
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.15s;
}
.card:hover { border-color: #60a5fa; transform: translateY(-2px); }
.card-img {
  width: 100%;
  aspect-ratio: 4/3;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  background: #15171c;
}
.card-img img {
  max-width: 100%;
  max-height: 100%;
  filter: invert(0.85);
  border-radius: 4px;
}
.card-info {
  padding: 10px 12px;
  border-top: 1px solid #334155;
}
.card-num { font-weight: 700; font-size: 0.85rem; color: #60a5fa; }
.card-cap { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
/* Lightbox */
.lb { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; justify-content: center; align-items: center; cursor: zoom-out; padding: 24px; }
.lb.active { display: flex; }
.lb img { max-width: 90vw; max-height: 80vh; filter: invert(0.85); border-radius: 8px; }
.lb-cap { color: #e5e7eb; margin-top: 16px; font-size: 0.95rem; text-align: center; max-width: 700px; }
/* Filter */
.filters { margin-bottom: 24px; display: flex; gap: 8px; flex-wrap: wrap; }
.filters button {
  background: #1e293b; color: #e5e7eb; border: 1px solid #334155; border-radius: 6px;
  padding: 6px 14px; font-size: 0.85rem; cursor: pointer; transition: all 0.15s;
}
.filters button:hover { background: #334155; }
.filters button.active { background: #60a5fa; color: #0f1115; border-color: #60a5fa; }
</style>
</head>
<body>

<p class="back"><a href="/ship">&larr; Назад</a></p>

<div class="filters">
<button class="active" onclick="filter('all')">Все (115)</button>
<button onclick="filter('ch1')">Глава 1 (21)</button>
<button onclick="filter('ch2')">Глава 2 (29)</button>
<button onclick="filter('ch3')">Глава 3 (65)</button>
</div>
<div class="grid" id="grid"></div>
</div>

<img id="lbi" src="">

const grid = document.getElementById('grid');
let currentFilter = 'all';

function render() {
  grid.innerHTML = '';
  const filtered = currentFilter === 'all' ? pics : pics.filter(p => p.ch === currentFilter);
  filtered.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.ch = p.ch;
    card.onclick = () => openLb(p);
    card.innerHTML = `<div class="card-img"><img src="img/pic${p.n}.png" alt="Рис. ${p.n}" loading="lazy"></div><div class="card-info"><span class="card-num">Рис. ${p.n}</span><div class="card-cap">${p.cap}</div></div>`;
    grid.appendChild(card);
  });
}

function filter(ch) {
  currentFilter = ch;
  document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function openLb(p) {
  document.getElementById('lbi').src = `img/pic${p.n}.png`;
  document.getElementById('lbc').textContent = `Рис. ${p.n}. ${p.cap}`;
  document.getElementById('lb').classList.add('active');
}

function closeLb() {
  document.getElementById('lb').classList.remove('active');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });

render();
