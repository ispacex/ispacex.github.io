const grid = document.getElementById('grid');
let currentFilter = 'all';

function render() {
  grid.innerHTML = '';
  const filtered = currentFilter === 'all' ? pics : pics.filter(p => p.ch === currentFilter);
  filtered.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.ch = p.ch;
    card.onclick = () => openLb(p);
    card.innerHTML = `<div class="card-img"><img src="img/pic${p.n}.png" alt="Рис. ${p.n}" loading="lazy"></div><div class="card-info"><span class="card-num">Рис. ${p.n}</span><div class="card-cap">${p.cap}</div></div>`;
    grid.appendChild(card);
  });
}

function filter(ch) {
  currentFilter = ch;
  document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

let currentPic = null;

function openLb(p, pushState) {
  currentPic = p;
  document.getElementById('lbi').src = `img/pic${p.n}.png`;
  document.getElementById('lbc').textContent = `Рис. ${p.n}. ${p.cap}`;
  document.getElementById('lb').classList.add('active');
  if (pushState !== false) history.pushState(null, '', `#pic${p.n}`);
}

function closeLb(pushState) {
  currentPic = null;
  document.getElementById('lb').classList.remove('active');
  if (pushState !== false) history.pushState(null, '', location.pathname + location.search);
}

function navLb(dir) {
  if (!currentPic) return;
  const filtered = currentFilter === 'all' ? pics : pics.filter(p => p.ch === currentFilter);
  const idx = filtered.findIndex(p => p.n === currentPic.n);
  const next = filtered[idx + dir];
  if (next) openLb(next);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') navLb(-1);
  if (e.key === 'ArrowRight') navLb(1);
});

window.addEventListener('popstate', () => {
  const m = location.hash.match(/^#pic(\d+)$/);
  if (m) {
    const p = pics.find(x => x.n === +m[1]);
    if (p) openLb(p, false);
  } else {
    closeLb(false);
  }
});

render();

// Handle initial hash on page load
(function() {
  const m = location.hash.match(/^#pic(\d+)$/);
  if (m) {
    const p = pics.find(x => x.n === +m[1]);
    if (p) openLb(p, false);
  }
})();
