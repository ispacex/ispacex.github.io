<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>

  <style>
    /* Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #0f1115;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Inter, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 90%;
      max-width: 800px;
      padding: 48px 24px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 16px;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 16px;
    }

    .block {
      background: #151922;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    code {
      display: block;
      margin-top: 12px;
      padding: 12px 16px;
      background: #0b0e14;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      font-size: 0.95rem;
      color: #93c5fd;
      word-break: break-all;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.7rem;
      }

      .block {
        padding: 24px;
      }
    }
  </style>
</head>
<body>

<body>

<header>Поддержать театр</header>

<main>
  {{ content }}
</main>

<footer></footer>

</body>
</html>
