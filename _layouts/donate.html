<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'ru' }}">
<head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Z1L94CNEJN"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-Z1L94CNEJN');

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>

  <style>
    /* Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #0f1115;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Inter, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 64px 0;
    }

    .container, main {
      width: 90%;
      max-width: 800px;
      padding: 48px 24px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 16px;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 16px;
    }

    .block {
      background: #151922;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    code {
      display: block;
      margin-top: 12px;
      padding: 12px 16px;
      background: #0b0e14;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      font-size: 0.95rem;
      color: #93c5fd;
      word-break: break-all;
    }

a {
  color: #7dd3fc;              /* light sky blue */
  text-decoration: none;
  transition: color 0.15s ease, text-decoration-color 0.15s ease;
}

a:hover {
  color: #38bdf8;              /* brighter on hover */
  text-decoration: underline;
}

a:visited {
  color: #94a3b8;              /* subtle gray-blue */
}

a:active {
  color: #0ea5e9;
}

@media (max-width: 480px) {
  body {
    padding: 24px 0;        /* less vertical padding on small screens */
  }

  .container, main {
    width: 92%;             /* slightly wider than 90% */
    padding: 24px 12px;     /* reduce side padding */
  }

  .block {
    padding: 18px;          /* reduce inner padding */
    border-radius: 10px;
  }

  h1 {
    font-size: 1.6rem;
    line-height: 1.2;
    margin-bottom: 12px;
  }

  p {
    font-size: 1rem;
    line-height: 1.7;       /* more breathable */
    margin-bottom: 12px;
  }

  code {
    font-size: 0.9rem;
    padding: 10px 12px;
    line-height: 1.4;
    word-break: break-word; /* better wrapping on mobile */
  }
}

  </style>
</head>
<body>

<body>

<main>
  <h2>Поддержите театр Артен</h2>
  <br />
  {{ content }}
</main>

<footer></footer>

<!-- Палитра перехода: страница отдельная, но и с неё надо уметь уйти. -->
<script src="/assets/js/palette.js" defer></script>
</body>
</html>
