remote_theme: "dracula/gh-pages"
google_analytics: "G-Z1L94CNEJN"

# Язык сайта. Без него макет темы объявлял каждую страницу английской
# (`lang="en-US"` — её умолчание), а сайт русский: читалка с экрана бралась
# читать русский текст по-английски, а поисковик считал его английским.
# Страница на другом языке ставит себе `lang:` во front matter и перебивает.
lang: ru

# Макет по умолчанию — свой (`_layouts/default.html`), а не темы: у макета темы
# нет ни одной точки расширения, и скрипт, который должен работать на каждой
# странице, вставить было некуда. Подробности — в самом макете.
#
# Раньше страницы получали макет темы, не называя его нигде, и как именно —
# понять по конфигу было нельзя. Теперь сказано прямо. Страницы, которым макет
# не нужен, ставят себе `layout: null` (указатели), а `donate` называет свой.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# `{% seo %}` в макете. Тема объявляет его у себя, но на своё «plugins»
# полагаться нельзя: локальная сборка идёт без темы.
plugins:
  - jekyll-seo-tag

# tools/ — конвейеры сборки /ksh/pv/, /ksh/ta/ и /ksh/tantrasara/, а не содержимое сайта.
# Список повторяет умолчания Jekyll: своё «exclude» их заменяет, а не дополняет.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - tools/
  - CLAUDE.md
  # Из общего репозитория поиска сайту нужны только search.js и сборщик
  # указателя (он сам просится в корень своим permalink).
  - sitesearch/README.md
  - sitesearch/FORMAT.md
  - sitesearch/node/
