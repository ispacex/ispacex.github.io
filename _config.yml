remote_theme: "dracula/gh-pages"
google_analytics: "G-Z1L94CNEJN"

# tools/ — конвейеры сборки /ksh/pv/, /ksh/ta/ и /ksh/tantrasara/, а не содержимое сайта.
# Список повторяет умолчания Jekyll: своё «exclude» их заменяет, а не дополняет.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - tools/
  - CLAUDE.md
  # Из общего репозитория поиска сайту нужны только search.js и сборщик
  # указателя (он сам просится в корень своим permalink).
  - sitesearch/README.md
  - sitesearch/FORMAT.md
  - sitesearch/node/
