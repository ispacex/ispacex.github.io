# Разделы сайта для поиска: ключ — первый сегмент адреса, порядок — тот же, в
# каком разделы перечислены на главной. Это про содержание, а не про механику,
# и потому живёт здесь, а не в общем репозитории (см. sitesearch/README.md).
#
# Раздел, которого тут нет, попадает в «Институт»: туда же идут главная и
# прочие страницы в корне, и стоят они первыми.
default:
  title: Институт
  order: 0

sections:
  art:     { title: Искусство,                     order: 1 }
  dance:   { title: Натьяшастра,                   order: 2 }
  nt:      { title: Natya talam,                   order: 3 }
  ksh:     { title: Кашмирский шиваизм,            order: 4 }
  theatre: { title: Театр,                         order: 5 }
  yoga:    { title: Йога,                          order: 6 }
  hoop:    { title: Обруч,                         order: 7 }
  books:   { title: Книги,                         order: 8 }
  ship:    { title: Теория плавания под парусами,  order: 9 }

# Указатели, собранные не Jekyll: он их не видит и собрать не может. Основной
# указатель называет их, и движок идёт по этому перечню сам — так состав сайта
# записан в одном месте, а не переписывается на каждой странице поиска.
#
# ship — книга Мархая: текст лежит на S3, справочники хранят данные в
# литералах JavaScript. Собирается руками: node ship/build-search-index.js.
# defer — мегабайт книги незачем везти тому, кто просто зашёл на страницу.
shards:
  - url: /ship/search-index.json
    section: Теория плавания под парусами
    order: 9
    defer: true

  # «Тантралока» — 5849 строф санскрита. Указатель собирает Jekyll, но не тот,
  # что по сайту: единица там абзац страницы, а здесь нужна строфа, иначе
  # находка ведёт в начало главы на триста строф (ksh/ta/search-index.json).
  # Страницы глав из основного указателя исключены (search: false) — текст в
  # двух указателях был бы им же дважды.
  #
  # defer — санскрит незачем везти тому, кто ищет по-русски и в другом разделе.
  - url: /ksh/ta/search-index.json
    section: Кашмирский шиваизм
    order: 4
    defer: true
